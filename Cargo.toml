[package]
name = "yomi"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A beautiful terminal RSS reader with Tokyo Night theme"
authors = ["seawn"]
license = "MIT"
keywords = ["rss", "feed", "terminal", "tui", "reader"]
categories = ["command-line-utilities"]
repository = "https://github.com/Smoke516/yomi"

[[bin]]
name = "yomi"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
feed-rs = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["rustls-tls"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.0"
open = "5.0"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
tokio-stream = "0.1"
clap = { version = "4.0", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
ego-tree = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
